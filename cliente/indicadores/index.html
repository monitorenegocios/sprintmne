*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f5f8fa;color:#172536}:root{--navy:#071b2c;--blue:#174b98;--cyan:#31c1ce;--text:#183247;--line:#e2e9ee}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--navy);color:#fff;padding:28px 20px}.logo{padding:2px 4px 28px;border-bottom:1px solid rgba(255,255,255,.12)}.logo img{display:block;width:178px;max-width:100%;height:auto}.sub{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#aebdca;margin-top:8px}.nav{margin-top:28px}.nav a{display:block;padding:12px 13px;margin-bottom:7px;border-radius:9px;color:#b8c7d3;text-decoration:none;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#10324a;color:#fff}.nav a.active{border-left:3px solid var(--cyan);padding-left:10px}.main{margin-left:250px;min-height:100vh;padding:38px 46px 60px}.container{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#31aeba;text-transform:uppercase;margin-bottom:10px}h1{font-size:30px;line-height:1.2;margin:0 0 9px;color:#10263a}.subtitle{font-size:13px;line-height:1.7;color:#667786;max-width:780px}.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;text-align:right}.status span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#80909d;margin-bottom:5px}.status strong{font-size:13px;color:#1d9a84}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(8,28,45,.04)}.company{padding:19px 22px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.company small{display:block;color:#8796a1;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}.company strong{font-size:17px;color:var(--text)}.company .meta{font-size:10px;color:#778793;text-align:right}.intro{padding:22px;margin-bottom:20px}.intro h2{font-size:18px;margin:0 0 9px;color:#10263a}.intro p{font-size:11px;line-height:1.75;color:#5f707e;margin:0}.notice{margin-top:15px;padding:13px 15px;border-left:3px solid var(--cyan);background:#f4fbfc;border-radius:8px;font-size:10px;line-height:1.65;color:#48606e}.indicator{padding:22px;margin-bottom:16px}.indicator-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.indicator-title{font-size:17px;font-weight:800;color:var(--text)}.indicator-meta{font-size:10px;color:#73838f;margin-top:5px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf7f8;color:#147a84;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#81919c;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e5;border-radius:8px;padding:11px 12px;font:500 11px Montserrat;background:#fff;color:var(--text);outline:none}.field textarea{min-height:68px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(49,193,206,.10)}.help{font-size:9px;color:#8a98a2;margin-top:5px;line-height:1.45}.example{font-size:9px;color:#73838f;background:#f7fafb;border-radius:7px;padding:8px 10px;margin-top:7px;line-height:1.5}.summary{padding:22px;margin-top:20px}.summary h2{font-size:18px;margin:0 0 8px}.summary p{font-size:11px;line-height:1.65;color:#6e7e89;margin:0 0 15px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary-item{border:1px solid #e3e9ed;border-radius:9px;padding:12px}.summary-item small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:1px .dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.kpi{padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff}.kpi small{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#7d8d99}.kpi strong{display:block;font-size:25px;color:var(--text);margin-top:8px}.kpi span{font-size:10px;color:#788894}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.chart-card{padding:20px;min-width:0}.chart-card h3{font-size:14px;margin:0 0 5px;color:var(--text)}.chart-card p{font-size:10px;color:#788894;line-height:1.5;margin:0 0 14px}.chart-area{min-height:220px;overflow:auto}.chart-area svg{width:100%;height:auto;min-width:300px;display:block}.chart-empty{padding:28px 12px;text-align:center;color:#81909b;background:#f7fafb;border-radius:9px;font-size:11px;line-height:1.7}.history-box{border-top:1px solid #e8eef1;margin-top:16px;padding-top:14px}.history-box h4{font-size:11px;margin:0 0 10px}.history-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.history-form label{display:block;font-size:9px;color:#81919c;font-weight:800;text-transform:uppercase;margin-bottom:5px}.history-form input{width:100%;padding:9px;border:1px solid #d7e0e5;border-radius:7px;font:500 10px Montserrat}.history-list{font-size:10px;color:#5f707e;margin-top:9px;line-height:1.8}.history-list button{border:0;background:none;color:#b42318;cursor:pointer;font-weight:700}.table-footnote{font-size:10px;color:#667786;line-height:1.6;margin-top:12px}

<body>
<aside class="sidebar"><div class="logo"><img src="../diagnostico/logo-monitore-branca.png" alt="Monitore Negócios Empresariais"><div class="sub">Gestão Empresarial</div></div><nav class="nav"><a href="../">Visão geral</a><a href="../diagnostico/">Diagnóstico</a><a href="../mapa-gestao/">Mapa de Gestão</a><a href="../matriz/">Matriz de Prioridades</a><a href="../plano/">Plano de Ação</a><a class="active" href="#">Indicadores</a><a href="../ferramentas/">Ferramentas</a><a href="../rotina/">Rotina de Gestão</a><a href="../relatorio/">Relatório Final</a></nav></aside>
<main class="main"><div class="container" id="app"><div class="loading">Carregando os Indicadores...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://reunexorxwbiirkypveu.supabase.co";
const SUPABASE_KEY="sb_publishable_1ucXcwRs0PsvEFWkLRsE1g_oIkKXlmg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defs=[
 {key:"gestao",name:"Gestão",desc:"Indicadores para acompanhar organização, gestão e execução."},
 {key:"excelencia_operacional",name:"Excelência Operacional",desc:"Indicadores para acompanhar eficiência, qualidade e processos."},
 {key:"inteligencia_negocios",name:"Inteligência de Negócios",desc:"Indicadores financeiros, comerciais e de desempenho."},
 {key:"desenvolvimento_pessoas",name:"Desenvolvimento de Pessoas",desc:"Indicadores relacionados a pessoas, liderança e desenvolvimento."}
];
let token="",diagnostico=null,prioridades=[],plano=[],indicadores=[];
let nextIndicatorId=1;
let historico={};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function ensureIds(){indicadores=indicadores.map(x=>({...x,_id:x._id||`ind${nextIndicatorId++}`}));}
function indicatorFor(pilar){return indicadores.filter(x=>x.pilar===pilar);}
function indicatorStatus(x){
 if(x.atual==null||String(x.atual).trim()===""||String(x.atual).toLowerCase().includes("não medido")||x.meta==null||String(x.meta).trim()==="")return "Sem linha de base/meta";
 const n=numericValue(x.atual),m=numericValue(x.meta);
 if(!Number.isFinite(n)||!Number.isFinite(m)||!x.sentido||x.sentido==="faixa")return "Definir avaliação";
 if(x.sentido==="menor")return n<=m?"Meta atingida":"Atenção";
 return n>=m?"Meta atingida":"Atenção";
}
function statusMarkup(x){
 const s=indicatorStatus(x);
 const cls=s==="Meta atingida"?"meta-atingida":s==="Atenção"?"atencao":"sem-meta";
 return `<span class="ind-status ${cls}">${esc(s)}</span>`;
}
function render(){
 const ordered=[...prioridades].sort((a,b)=>Number(a.ordem)-Number(b.ordem)).slice(0,4);
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="eyebrow">Sprint de Gestão · Etapa 05</div><h1>Indicadores de Gestão</h1><div class="subtitle">Defina os indicadores que vão mostrar se as ações prioritárias estão avançando. Cadastre uma ou mais fichas por prioridade e consolide os resultados em um painel de acompanhamento.</div></div><div class="status"><span>Status</span><strong id="saveStatus">Em construção</strong></div></div>
 <div class="card company"><div><small>Empresa avaliada</small><strong>${esc(diagnostico.empresa)}</strong></div><div class="meta">${esc(diagnostico.responsavel)}<br>${esc(diagnostico.segmento)} · ${esc(diagnostico.colaboradores)}</div></div>
 <section class="card intro"><h2>O que será entregue nesta etapa?</h2><p>Você vai construir fichas técnicas dos indicadores, organizar uma visão consolidada para acompanhamento e exportar os registros para Excel. Cada ficha documenta o que será medido, como calcular, a situação atual, a meta, a frequência, o responsável e a fonte dos dados.</p><div class="notice"><strong>Como usar:</strong> comece com poucos indicadores que ajudem a tomar decisões. Se ainda não houver dados, registre “Não medido” na situação atual e combine como obter a linha de base. O status do painel é uma indicação inicial; confirme se a meta deve aumentar ou diminuir antes de interpretar o resultado.</div></section>
 <div class="dashboard" id="kpiDashboard"></div>
 <div class="charts">
   <section class="card chart-card"><h3>Resultado atual × meta</h3><p>Comparação dos indicadores numéricos com metas numéricas. O sentido da meta é considerado na avaliação.</p><div class="chart-area" id="targetChart"></div></section>
   <section class="card chart-card"><h3>Evolução dos resultados</h3><p>Registre medições periódicas nas fichas para visualizar a evolução ao longo do tempo.</p><div class="chart-area" id="trendChart"></div></section>
 </div>
 <section class="card indicator">
   <div class="ind-toolbar"><div><div class="indicator-title">Painel inicial de indicadores</div><div class="indicator-meta">Resumo dos indicadores cadastrados e situação em relação à meta</div></div><div class="ind-actions"><button class="button secondary" id="exportBtn" type="button">Exportar para Excel (.xlsx)</button><button class="button" id="saveBtn" type="button">Salvar indicadores</button></div></div>
   <div class="ind-table-wrap"><table class="ind-table"><thead><tr><th>Prioridade / pilar</th><th>Indicador</th><th>Resultado atual</th><th>Meta</th><th>Periodicidade</th><th>Responsável</th><th>Status inicial</th></tr></thead><tbody>${ordered.map((p,i)=>{
    const d=defs.find(x=>x.key===p.pilar)||{name:p.pilar};
    const list=indicatorFor(p.pilar);
    if(!list.length)return `<tr><td>${i+1}. ${esc(d.name)}</td><td colspan="6" style="color:#81909b">Nenhum indicador cadastrado para esta prioridade.</td></tr>`;
    return list.map(x=>`<tr><td>${i+1}. ${esc(d.name)}</td><td>${esc(x.nome||"Indicador a definir")}</td><td>${esc(x.atual||"Não medido")}</td><td>${esc(x.meta||"A definir")}</td><td>${esc(x.periodicidade||"A definir")}</td><td>${esc(x.responsavel||"A definir")}</td><td>${statusMarkup(x)}</td></tr>`).join("");
   }).join("")}</tbody></table></div>
   <div class="table-footnote">O status é uma referência inicial baseada nos valores informados. Indicadores em que a meta é reduzir um resultado, ou que usam escalas específicas, precisam ter o sentido da meta confirmado para evitar interpretações incorretas.</div>
 </section>
 <div class="section-title"><h2>Fichas técnicas dos indicadores</h2><p>Cadastre vários indicadores por prioridade</p></div>
 <div class="ind-list">${ordered.map((p,i)=>{
   const d=defs.find(x=>x.key===p.pilar)||{name:p.pilar,desc:""};
   const list=indicatorFor(p.pilar);
   return `<section class="card indicator"><div class="indicator-head"><div><span class="tag">Prioridade ${i+1}</span><div class="indicator-title">${esc(d.name)}</div><div class="indicator-meta">${esc(d.desc)}</div></div><div class="tag">Índice ${esc(p.indice)}</div></div>
   <div class="ind-list" data-pilar-list="${esc(p.pilar)}">${list.map((x,j)=>indicatorCard(p.pilar,x,j)).join("")}</div>
   <button class="button secondary add-indicator" type="button" data-add-pilar="${esc(p.pilar)}">+ Adicionar indicador para ${esc(d.name)}</button></section>`;
 }).join("")}</div>
 <section class="card summary"><h2>Entrega desta etapa</h2><p>Ao concluir, a empresa terá fichas técnicas preenchidas, um resumo inicial dos indicadores e uma planilha Excel para registrar os resultados conforme a periodicidade definida. O acompanhamento ao longo do tempo dependerá da atualização dos dados pelos responsáveis.</p><div class="summary-grid"><div class="summary-item"><small>Fichas cadastradas</small><b id="countIndicators">${indicadores.length}</b></div><div class="summary-item"><small>Prioridades cobertas</small><b>${new Set(indicadores.map(x=>x.pilar)).size} de ${ordered.length}</b></div><div class="summary-item"><small>Formato de saída</small><b>Excel (.xlsx)</b></div><div class="summary-item"><small>Próxima etapa</small><b>Ferramentas de Gestão</b></div></div><div class="saved" id="savedMsg"></div></section>
 <section class="actions"><div><h3>Próxima etapa: Ferramentas de Gestão</h3><p>Salve as fichas e use as ferramentas adequadas para apoiar a execução e o acompanhamento.</p></div><div class="buttons"><a class="button secondary" href="../plano/?token=${encodeURIComponent(token)}">Voltar ao Plano</a><a class="button" href="../ferramentas/?token=${encodeURIComponent(token)}">Ir para Ferramentas →</a></div></section>`;
 bindEvents();
}
function indicatorCard(pilar,x,j){
 return `<article class="card" style="padding:16px;border-radius:10px;box-shadow:none" data-indicator-id="${esc(x._id)}"><div class="indicator-head"><div><div class="indicator-title" style="font-size:13px">Ficha ${j+1}: ${esc(x.nome||"Novo indicador")}</div><div class="indicator-meta">Preencha os campos para definir como medir e acompanhar este indicador.</div></div><button type="button" class="indicator-delete" data-delete-id="${esc(x._id)}">Excluir ficha</button></div><div class="grid">
 <div class="field full"><label>1. Nome do indicador</label><input data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="nome" value="${esc(x.nome)}" placeholder="Ex.: Percentual de processos padronizados"><div class="help">Qual resultado será acompanhado?</div></div>
 <div class="field"><label>2. Objetivo do indicador</label><textarea data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="objetivo" placeholder="Que decisão ou melhoria ele ajuda a acompanhar?">${esc(x.objetivo)}</textarea></div>
 <div class="field"><label>3. Fórmula de cálculo</label><textarea data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="formula" placeholder="Ex.: processos padronizados ÷ processos mapeados × 100">${esc(x.formula)}</textarea></div>
 <div class="field"><label>4. Unidade de medida</label><select data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="unidade"><option value="">Selecione</option>${["%","Quantidade","R$","dias","horas","índice","outro"].map(v=>`<option ${v===x.unidade?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="field"><label>5. Sentido da meta</label><select data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="sentido"><option value="">Selecione</option>${[["maior","Quanto maior, melhor"],["menor","Quanto menor, melhor"],["faixa","Manter dentro de uma faixa"]].map(([v,t])=>`<option value="${v}" ${v===(x.sentido||"")?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="field"><label>6. Resultado atual / linha de base</label><input data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="atual" value="${esc(x.atual)}" placeholder="Ex.: 62% ou Não medido"><div class="help">Ponto de partida para comparar a evolução.</div></div>
 <div class="field"><label>7. Meta e prazo</label><input data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="meta" value="${esc(x.meta)}" placeholder="Ex.: alcançar 90% até 30/11"></div>
 <div class="field"><label>8. Periodicidade</label><select data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="periodicidade"><option value="">Selecione</option>${["Diária","Semanal","Quinzenal","Mensal","Trimestral"].map(v=>`<option ${v===x.periodicidade?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="field"><label>9. Responsável pelo acompanhamento</label><input data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="responsavel" value="${esc(x.responsavel)}" placeholder="Nome ou função"></div>
 <div class="field"><label>10. Fonte dos dados</label><input data-ind-id="${esc(x._id)}" data-pilar="${esc(pilar)}" data-field="fonte" value="${esc(x.fonte)}" placeholder="Ex.: financeiro, ERP, RH, planilha"></div>
 </div><div class="history-box"><h4>Registrar nova medição</h4><div class="history-form"><div><label>Data da medição</label><input type="date" data-history-date="${esc(x._id)}" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Resultado numérico</label><input type="number" step="any" data-history-value="${esc(x._id)}" placeholder="Ex.: 35"></div><button type="button" class="button secondary add-measurement" data-history-id="${esc(x._id)}">Registrar</button></div><div class="history-list">${historyMarkup(x._id)}</div></div></article>`;
}
function bindEvents(){
 document.querySelectorAll("[data-field][data-ind-id]").forEach(el=>{el.addEventListener("input",capture);el.addEventListener("change",capture);});
 document.querySelectorAll(".add-indicator").forEach(btn=>btn.addEventListener("click",()=>addIndicator(btn.dataset.addPilar)));
 document.querySelectorAll("[data-delete-id]").forEach(btn=>btn.addEventListener("click",()=>deleteIndicator(btn.dataset.deleteId)));
 document.getElementById("saveBtn").addEventListener("click",save);
 document.getElementById("exportBtn").addEventListener("click",exportExcel);
 document.querySelectorAll(".add-measurement").forEach(btn=>btn.addEventListener("click",()=>addMeasurement(btn.dataset.historyId)));
 document.querySelectorAll("[data-remove-measurement]").forEach(btn=>btn.addEventListener("click",()=>removeMeasurement(btn.dataset.id,Number(btn.dataset.index))));
 renderCharts();
}
function capture(){
 const id=this.dataset.indId,p=this.dataset.pilar;
 let x=indicadores.find(i=>i._id===id);
 if(!x){x={_id:id,pilar:p};indicadores.push(x);}
 x[this.dataset.field]=this.value;
}
function collectForm(){
 document.querySelectorAll("[data-field][data-ind-id]").forEach(el=>{
  const id=el.dataset.indId,p=el.dataset.pilar;
  let x=indicadores.find(i=>i._id===id);
  if(!x){x={_id:id,pilar:p};indicadores.push(x);}
  x[el.dataset.field]=el.value;
 });
 return indicadores;
}
function addIndicator(pilar){
 collectForm();
 indicadores.push({_id:`ind${nextIndicatorId++}`,pilar,sentido:"",unidade:"",periodicidade:""});
 render();
}
function deleteIndicator(id){
 collectForm();
 const x=indicadores.find(i=>i._id===id);
 if(!x)return;
 if(indicadores.filter(i=>i.pilar===x.pilar).length<=1){alert("Mantenha ao menos uma ficha por prioridade. Você pode limpar os campos se não precisar definir o indicador agora.");return;}
 indicadores=indicadores.filter(i=>i._id!==id);
 render();
}
function historyMarkup(id){
 const arr=historico[id]||[]; if(!arr.length)return 'Nenhuma medição registrada ainda.';
 return arr.slice().sort((a,b)=>b.data.localeCompare(a.data)).map((m)=>{const idx=arr.indexOf(m);return `${esc(m.data)} · ${esc(m.valor)} <button type="button" data-remove-measurement="1" data-id="${esc(id)}" data-index="${idx}">Excluir</button>`}).join('<br>');
}
function addMeasurement(id){
 const date=document.querySelector(`[data-history-date="${CSS.escape(id)}"]`);
 const val=document.querySelector(`[data-history-value="${CSS.escape(id)}"]`);
 if(!date?.value||val?.value===""||!Number.isFinite(Number(val.value))){alert('Informe a data e um resultado numérico válido.');return;}
 historico[id]=historico[id]||[];historico[id].push({data:date.value,valor:Number(val.value)});historico[id].sort((a,b)=>a.data.localeCompare(b.data));
 localStorage.setItem('sprint_indicadores_historico_'+token,JSON.stringify(historico));
 render();
}
function removeMeasurement(id,index){historico[id]?.splice(index,1);localStorage.setItem('sprint_indicadores_historico_'+token,JSON.stringify(historico));render();}
function numericValue(v){if(v==null)return NaN;const m=String(v).replace(/\s/g,'').replace(/R\$/i,'').replace('%','').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.');return Number(m);}
function svgBarChart(items){
 if(!items.length)return '<div class="chart-empty">Ainda não há indicadores com resultado e meta numéricos para comparar.<br>Preencha os campos de resultado atual, meta e sentido da meta.</div>';
 const width=560,row=44,top=18,left=170,right=35,height=top+items.length*row+22,plot=width-left-right;
 const max=Math.max(1,...items.flatMap(x=>[x.atual,x.meta]));
 let out=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Comparação de resultado atual e meta"><text x="${left}" y="12" font-size="9" fill="#718391">0</text><text x="${width-right}" y="12" text-anchor="end" font-size="9" fill="#718391">${max.toLocaleString('pt-BR')}</text>`;
 items.forEach((x,i)=>{const y=top+i*row;const aw=Math.max(0,x.atual/max*plot),mw=Math.max(0,x.meta/max*plot);const good=x.sentido==='menor'?x.atual<=x.meta:x.atual>=x.meta;out+=`<text x="${left-9}" y="${y+12}" text-anchor="end" font-size="9" fill="#183247">${esc(x.nome.slice(0,24))}</text><rect x="${left}" y="${y+1}" width="${plot}" height="10" rx="4" fill="#edf2f5"/><rect x="${left}" y="${y+1}" width="${mw}" height="10" rx="4" fill="#c7d6e1"/><rect x="${left}" y="${y+16}" width="${plot}" height="10" rx="4" fill="#edf2f5"/><rect x="${left}" y="${y+16}" width="${aw}" height="10" rx="4" fill="${good?'#22a58a':'#e3a53d'}"/><text x="${left}" y="${y+38}" font-size="8" fill="#718391">Atual: ${x.atual} · Meta: ${x.meta}</text>`});
 return out+'</svg><div style="font-size:9px;color:#718391;margin-top:8px">Barra cinza-azulada: meta · Barra colorida: resultado atual.</div>';
}
function renderCharts(){
 const named=indicadores.filter(x=>x.nome&&numericValue(x.atual)!==NaN&&Number.isFinite(numericValue(x.atual))&&Number.isFinite(numericValue(x.meta))&&x.sentido&&x.sentido!=='faixa').map(x=>({...x,atual:numericValue(x.atual),meta:numericValue(x.meta)}));
 const all=indicadores.filter(x=>x.nome);const statuses=all.map(indicatorStatus);const achieved=statuses.filter(s=>s==='Meta atingida').length;const attention=statuses.filter(s=>s==='Atenção').length;const missing=statuses.filter(s=>s==='Sem linha de base/meta'||s==='Definir avaliação').length;
 const k=document.getElementById('kpiDashboard');if(k)k.innerHTML=`<div class="kpi"><small>Indicadores cadastrados</small><strong>${all.length}</strong><span>Com nome definido</span></div><div class="kpi"><small>Dentro da meta</small><strong>${achieved}</strong><span>Conforme regra cadastrada</span></div><div class="kpi"><small>Precisam de atenção</small><strong>${attention}</strong><span>Resultado abaixo/acima da meta esperada</span></div><div class="kpi"><small>Sem avaliação</small><strong>${missing}</strong><span>Dados ou sentido da meta pendentes</span></div>`;
 const tc=document.getElementById('targetChart');if(tc)tc.innerHTML=svgBarChart(named);
 const entries=Object.entries(historico).flatMap(([id,arr])=>{const x=indicadores.find(i=>i._id===id);return x?(arr||[]).map(m=>({...m,nome:x.nome||'Indicador',id})):[]}).sort((a,b)=>a.data.localeCompare(b.data));
 const trend=document.getElementById('trendChart');if(!trend)return;
 if(entries.length<2){trend.innerHTML='<div class="chart-empty">O gráfico aparecerá quando houver pelo menos duas medições registradas.<br>Use “Registrar nova medição” em cada ficha técnica para construir o histórico.</div>';return;}
 const groups={};entries.forEach(e=>(groups[e.id]=groups[e.id]||[]).push(e));const chosen=Object.values(groups).filter(a=>a.length>=2).sort((a,b)=>b.length-a.length)[0];
 if(!chosen){trend.innerHTML='<div class="chart-empty">Registre pelo menos duas medições para o mesmo indicador para visualizar sua evolução.</div>';return;}
 const w=560,h=230,l=42,r=15,t=18,b=38,vals=chosen.map(x=>x.valor),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,px=i=>l+i*(w-l-r)/(chosen.length-1),py=v=>t+(max-v)*(h-t-b)/span;
 let svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução histórica"><line x1="${l}" y1="${t}" x2="${l}" y2="${h-b}" stroke="#dce5ea"/><line x1="${l}" y1="${h-b}" x2="${w-r}" y2="${h-b}" stroke="#dce5ea"/><text x="${l-6}" y="${t+4}" text-anchor="end" font-size="9" fill="#718391">${max}</text><text x="${l-6}" y="${h-b}" text-anchor="end" font-size="9" fill="#718391">${min}</text>`;
 svg+=`<polyline fill="none" stroke="#20a6b6" stroke-width="3" points="${chosen.map((x,i)=>`${px(i)},${py(x.valor)}`).join(' ')}"/>`;
 chosen.forEach((x,i)=>{svg+=`<circle cx="${px(i)}" cy="${py(x.valor)}" r="4" fill="#20a6b6"/><text x="${px(i)}" y="${h-18}" text-anchor="middle" font-size="8" fill="#718391">${esc(x.data.slice(5))}</text>`});
 trend.innerHTML=`<div style="font-size:10px;font-weight:700;margin-bottom:6px;color:#183247">${esc(chosen[0].nome)}</div>${svg}</svg><div style="font-size:9px;color:#718391;margin-top:8px">Histórico armazenado neste navegador. Para uso em outros dispositivos, será necessário persistir as medições no banco de dados.</div>`;
}
function exportExcel(){
 collectForm();
 if(typeof XLSX==="undefined"){alert("Não foi possível carregar o exportador Excel. Verifique sua conexão e tente novamente.");return;}
 const rows=[["Pilar","Indicador","Objetivo","Fórmula","Unidade","Sentido da meta","Resultado atual","Meta e prazo","Periodicidade","Responsável","Fonte dos dados","Status inicial"]];
 indicadores.forEach(x=>{
  const d=defs.find(y=>y.key===x.pilar)||{name:x.pilar};
  rows.push([d.name,x.nome||"",x.objetivo||"",x.formula||"",x.unidade||"",x.sentido||"",x.atual||"",x.meta||"",x.periodicidade||"",x.responsavel||"",x.fonte||"",indicatorStatus(x)]);
 });
 const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:28},{wch:32},{wch:38},{wch:42},{wch:15},{wch:24},{wch:20},{wch:24},{wch:18},{wch:25},{wch:28},{wch:22}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Fichas de Indicadores");
 const hr=[['Pilar','Indicador','Data','Resultado']];Object.entries(historico).forEach(([id,arr])=>{const x=indicadores.find(i=>i._id===id);if(x)(arr||[]).forEach(m=>hr.push([(defs.find(d=>d.key===x.pilar)||{}).name||x.pilar,x.nome||'',m.data,m.valor]));});const hws=XLSX.utils.aoa_to_sheet(hr);XLSX.utils.book_append_sheet(wb,hws,'Histórico de medições');
 XLSX.writeFile(wb,`Indicadores_Monitore_${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function save(){
 collectForm();
 const payload=indicadores.map(({_id,...x})=>x);
 const btn=document.getElementById("saveBtn");btn.disabled=true;document.getElementById("saveStatus").textContent="Salvando...";
 const {error}=await sb.rpc("save_sprint_indicadores",{p_access_token:token,p_indicadores:payload});
 if(error){console.error(error);document.getElementById("saveStatus").textContent="Erro ao salvar";document.getElementById("savedMsg").textContent="Não foi possível salvar. Verifique se a função save_sprint_indicadores aceita múltiplas fichas para o mesmo pilar.";btn.disabled=false;return;}
 document.getElementById("saveStatus").textContent="Indicadores salvos";document.getElementById("savedMsg").textContent="Fichas de indicadores salvas com sucesso.";btn.textContent="Indicadores Salvos ✓";btn.disabled=false;
}
async function load(){
 try{
  const params=new URLSearchParams(window.location.search);const fromUrl=params.get("token");if(fromUrl)localStorage.setItem("sprint_diagnostico_token",fromUrl);token=fromUrl||localStorage.getItem("sprint_diagnostico_token");
  try{historico=JSON.parse(localStorage.getItem("sprint_indicadores_historico_"+token)||"{}")}catch(e){historico={}}
  if(!token){document.getElementById("app").innerHTML='<div class="card empty">Diagnóstico ainda não localizado.<br><br>Conclua o diagnóstico primeiro.</div>';return;}
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tempo limite de conexão com o Supabase.")),15000));
  const d=await Promise.race([sb.rpc("get_sprint_diagnostico",{p_access_token:token}),timeout]);if(d.error||!d.data?.length)throw new Error(d.error?.message||"Diagnóstico não encontrado.");
  diagnostico=d.data[0];
  const m=await Promise.race([sb.rpc("get_sprint_matriz",{p_access_token:token}),timeout]);if(m.error||!m.data?.length)throw new Error("A Matriz de Prioridades ainda não foi salva.");
  prioridades=Array.isArray(m.data[0].prioridades)?m.data[0].prioridades:[];if(!prioridades.length)throw new Error("A Matriz foi encontrada, mas não contém prioridades.");
  const p=await Promise.race([sb.rpc("get_sprint_plano",{p_access_token:token}),timeout]);if(!p.error&&p.data?.length)plano=Array.isArray(p.data[0].acoes)?p.data[0].acoes:[];
  const ind=await Promise.race([sb.rpc("get_sprint_indicadores",{p_access_token:token}),timeout]);if(!ind.error&&ind.data?.length)indicadores=Array.isArray(ind.data[0].indicadores)?ind.data[0].indicadores:[];
  render();
 }catch(err){console.error(err);document.getElementById("app").innerHTML='<div class="card empty error"><strong>Não foi possível carregar os Indicadores.</strong><br><br>'+esc(err.message||"Erro de conexão")+'<br><br>Atualize a página. Se o problema continuar, envie esta tela para a Monitore.</div>';}
}
load();
