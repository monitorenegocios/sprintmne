<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Gestão | Sprint Monitore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f5f8fa;color:#172536}:root{--navy:#071b2c;--blue:#174b98;--cyan:#31c1ce;--text:#183247;--line:#e2e9ee}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--navy);color:#fff;padding:28px 20px}.logo{padding:2px 4px 28px;border-bottom:1px solid rgba(255,255,255,.12)}.logo img{display:block;width:178px;max-width:100%;height:auto}.sub{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#aebdca;margin-top:8px}.nav{margin-top:28px}.nav a{display:block;padding:12px 13px;margin-bottom:7px;border-radius:9px;color:#b8c7d3;text-decoration:none;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#10324a;color:#fff}.nav a.active{border-left:3px solid var(--cyan);padding-left:10px}.main{margin-left:250px;min-height:100vh;padding:38px 46px 60px}.container{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#31aeba;text-transform:uppercase;margin-bottom:10px}h1{font-size:30px;line-height:1.2;margin:0 0 9px;color:#10263a}.subtitle{font-size:13px;line-height:1.7;color:#667786;max-width:760px}.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;text-align:right}.status span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#80909d;margin-bottom:5px}.status strong{font-size:13px;color:#1d9a84}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(8,28,45,.04)}.company{padding:19px 22px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.company small{display:block;color:#8796a1;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}.company strong{font-size:17px;color:var(--text)}.company .meta{font-size:10px;color:#778793;text-align:right}.summary{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:14px;margin-bottom:24px}.metric{padding:20px}.metric .label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#83929e;font-weight:700}.metric strong{display:block;font-size:24px;color:#10263a;margin-top:8px}.metric small{display:block;margin-top:5px;color:#7b8a96;font-size:10px}.meter{height:7px;background:#e9eef1;border-radius:10px;margin-top:12px;overflow:hidden}.meter i{display:block;height:100%;border-radius:10px;background:var(--cyan)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.section-title h2{font-size:18px;margin:0;color:#10263a}.section-title p{margin:0;font-size:10px;color:#84929d}.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.pillar{padding:21px;position:relative;overflow:hidden}.pillar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}.pillar-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.num{font-size:10px;color:#8797a4;font-weight:800;letter-spacing:1px}.pillar h3{margin:6px 0;font-size:16px;color:var(--text)}.tag{font-size:9px;font-weight:800;padding:6px 9px;border-radius:20px;white-space:nowrap}.high{background:#fde9e7;color:#bd4d43}.medium{background:#fff4df;color:#b77712}.low{background:#e7f7f1;color:#19856d}.scoreline{display:flex;align-items:center;gap:12px;margin:15px 0 16px}.scoreline strong{font-size:25px;color:var(--blue)}.scoreline span{font-size:10px;color:#80909c}.bar{height:7px;flex:1;background:#e7edf1;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan);border-radius:10px}.block{border-top:1px solid #edf1f3;padding-top:13px;margin-top:13px}.block label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#9aa7b0;font-weight:800;margin-bottom:4px}.block p{font-size:11px;line-height:1.6;color:#405361;margin:0}.priority{margin-top:24px;padding:22px}.priority h2{font-size:18px;margin:0 0 5px}.priority>p{font-size:11px;color:#71808c;line-height:1.6;margin:0 0 16px}.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.priority-item{border:1px solid #e3e9ed;border-radius:10px;padding:15px}.priority-item b{font-size:11px;color:var(--text)}.priority-item span{display:block;font-size:10px;color:#778793;margin-top:5px;line-height:1.5}.next{margin-top:24px;padding:22px;background:var(--navy);color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}.next h3{margin:0 0 6px;font-size:16px}.next p{margin:0;color:#b8c8d4;font-size:11px;line-height:1.6}.button{border:0;background:var(--cyan);color:#062033;padding:12px 18px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}.loading,.empty{padding:45px;text-align:center;color:#71808c;font-size:12px}.error{color:#b94a43}@media(max-width:900px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:28px 20px}.summary,.pillars,.priority-grid{grid-template-columns:1fr}.top{flex-direction:column}.status{text-align:left;width:100%}.company{display:block}.company .meta{text-align:left;margin-top:8px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo"><img src="../diagnostico/logo-monitore-branca.png" alt="Monitore Negócios Empresariais"><div class="sub">Gestão Empresarial</div></div><nav class="nav"><a href="../">Visão geral</a><a href="../diagnostico/">Diagnóstico</a><a class="active" href="#">Mapa de Gestão</a><a href="../matriz/">Matriz de Prioridades</a><a href="../plano/">Plano de Ação</a><a href="../indicadores/">Indicadores</a><a href="../ferramentas/">Ferramentas</a><a href="../rotina/">Rotina de Gestão</a><a href="../relatorio/">Relatório Final</a></nav></aside>
<main class="main"><div class="container" id="app"><div class="loading">Carregando seu Mapa de Gestão...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://reunexorxwbiirkypveu.supabase.co";
const SUPABASE_KEY="sb_publishable_1ucXCwRs0PsvEFWkLRsE1g_oIkKXlmg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defs=[{key:"gestao",name:"Gestão",desc:"Direcionamento, organização, liderança e tomada de decisão.",num:"01"},{key:"excelencia_operacional",name:"Excelência Operacional",desc:"Processos, padronização, eficiência e melhoria contínua.",num:"02"},{key:"inteligencia_negocios",name:"Inteligência de Negócios",desc:"Indicadores, informações, custos, resultados e decisões orientadas por dados.",num:"03"},{key:"desenvolvimento_pessoas",name:"Desenvolvimento de Pessoas",desc:"Clareza de papéis, liderança, feedback, capacitação e desenvolvimento.",num:"04"}];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function priority(m){if(m<=2.4)return{label:"Alta prioridade",cls:"high"};if(m<3.5)return{label:"Média prioridade",cls:"medium"};return{label:"Baixa prioridade",cls:"low"};}
function situation(m){if(m<=2.4)return"A dimensão apresenta baixa estruturação e deve ser tratada entre os principais focos do Sprint.";if(m<3.5)return"A dimensão apresenta estruturação parcial e possui oportunidades claras de evolução.";return"A dimensão apresenta uma estruturação mais consistente, com oportunidades de aperfeiçoamento e consolidação.";}
function render(d){const scores=d.pontuacoes||{},vis=d.visao_prioridades||{};const arr=defs.map(x=>({...x,m:Number(scores[x.key]?.maturidade||0)}));const geral=arr.reduce((a,x)=>a+x.m,0)/arr.length;const high=arr.filter(x=>x.m<=2.4).sort((a,b)=>a.m-b.m),medium=arr.filter(x=>x.m>2.4&&x.m<3.5).sort((a,b)=>a.m-b.m),low=arr.filter(x=>x.m>=3.5).sort((a,b)=>b.m-a.m),prioridade=[...high,...medium,...low];document.getElementById("app").innerHTML=`
<div class="top"><div><div class="eyebrow">Sprint de Gestão · Etapa 02</div><h1>Mapa de Gestão</h1><div class="subtitle">Este mapa foi gerado automaticamente a partir das respostas do Diagnóstico de Maturidade Empresarial. Ele organiza os resultados em uma visão executiva para orientar as próximas decisões.</div></div><div class="status"><span>Status</span><strong>Gerado pelo diagnóstico</strong></div></div>
<div class="card company"><div><small>Empresa avaliada</small><strong>${esc(d.empresa)}</strong></div><div class="meta">${esc(d.responsavel)}<br>${esc(d.segmento)} · ${esc(d.colaboradores)}</div></div>
<div class="summary"><div class="card metric"><div class="label">Maturidade geral</div><strong>${geral.toFixed(1)} / 5</strong><small>Média dos quatro pilares avaliados</small><div class="meter"><i style="width:${Math.min(100,geral/5*100)}%"></i></div></div><div class="card metric"><div class="label">Alta prioridade</div><strong>${high.length}</strong><small>Pilares até 2,4 de maturidade</small></div><div class="card metric"><div class="label">Média prioridade</div><strong>${medium.length}</strong><small>Pilares entre 2,5 e 3,4</small></div><div class="card metric"><div class="label">Percepção do responsável</div><strong style="font-size:16px;line-height:1.35">${esc(vis.pilar_prioritario||"Não informado")}</strong><small>Pilar indicado no diagnóstico</small></div></div>
<div class="section-title"><h2>Mapa dos quatro pilares</h2><p>Resultado calculado pelas respostas de 1 a 5</p></div><div class="pillars">${arr.map(x=>{const p=priority(x.m);return `<article class="card pillar"><div class="pillar-head"><div><div class="num">${x.num} · PILAR</div><h3>${x.name}</h3><div style="font-size:10px;color:#7a8994;line-height:1.5">${x.desc}</div></div><span class="tag ${p.cls}">${p.label}</span></div><div class="scoreline"><strong>${x.m.toFixed(1)}/5</strong><span>Maturidade</span><div class="bar"><i style="width:${Math.min(100,x.m/5*100)}%"></i></div></div><div class="block"><label>Leitura do resultado</label><p>${situation(x.m)}</p></div></article>`}).join("")}</div>
<section class="card priority"><h2>Foco inicial</h2><p>A combinação da maturidade calculada com a percepção informada no diagnóstico orienta os primeiros pontos que serão levados para a Matriz de Prioridades.</p><div class="priority-grid">${prioridade.slice(0,3).map((x,i)=>`<div class="priority-item"><b>${i+1}. ${x.name}</b><span>${x.m.toFixed(1)}/5 · ${priority(x.m).label}</span></div>`).join("")}</div><div class="block"><label>Principal desafio informado</label><p>${esc(vis.maior_desafio||"Não informado")}</p></div><div class="block"><label>Problema que o responsável gostaria de resolver em 30 dias</label><p>${esc(vis.problema_30_dias||"Não informado")}</p></div></section>
<section class="next"><div><h3>Próxima etapa: Matriz de Prioridades</h3><p>O Mapa identifica onde estão os pontos de atenção. A próxima etapa definirá o que deve ser tratado primeiro.</p></div><a class="button" href="../">Voltar à Área do Cliente</a></section>`;}
async function load(){const token=localStorage.getItem("sprint_diagnostico_token");if(!token){document.getElementById("app").innerHTML='<div class="card empty"><strong>Diagnóstico ainda não localizado.</strong><br><br>Conclua o diagnóstico primeiro para gerar o Mapa de Gestão.</div>';return;}const{data,error}=await sb.rpc("get_sprint_diagnostico",{p_access_token:token});if(error){console.error("Erro ao carregar diagnóstico:",error);const detalhe=String(error.message||"Erro desconhecido");const codigo=String(error.code||"sem código");const detalhes=String(error.details||"não informado");const hint=String(error.hint||"não informado");document.getElementById("app").innerHTML=`<div class="card empty error"><strong>Erro ao carregar o Mapa de Gestão</strong><br><br><b>Código:</b> ${esc(codigo)}<br><b>Mensagem:</b> ${esc(detalhe)}<br><b>Detalhes:</b> ${esc(detalhes)}<br><b>Hint:</b> ${esc(hint)}<br><br><small>Token encontrado no navegador: ${token?"SIM":"NÃO"}</small></div>`;return;}if(!data||!data.length){document.getElementById("app").innerHTML='<div class="card empty">Diagnóstico não encontrado para este acesso.</div>';return;}render(data[0]);}load();
</script></body></html>
