<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matriz de Prioridades | Sprint Monitore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f5f8fa;color:#172536}:root{--navy:#071b2c;--blue:#174b98;--cyan:#31c1ce;--text:#183247;--line:#e2e9ee}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--navy);color:#fff;padding:28px 20px}.logo{padding:2px 4px 28px;border-bottom:1px solid rgba(255,255,255,.12)}.logo img{display:block;width:178px;max-width:100%;height:auto}.sub{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#aebdca;margin-top:8px}.nav{margin-top:28px}.nav a{display:block;padding:12px 13px;margin-bottom:7px;border-radius:9px;color:#b8c7d3;text-decoration:none;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#10324a;color:#fff}.nav a.active{border-left:3px solid var(--cyan);padding-left:10px}.main{margin-left:250px;min-height:100vh;padding:38px 46px 60px}.container{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#31aeba;text-transform:uppercase;margin-bottom:10px}h1{font-size:30px;line-height:1.2;margin:0 0 9px;color:#10263a}.subtitle{font-size:13px;line-height:1.7;color:#667786;max-width:780px}.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;text-align:right}.status span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#80909d;margin-bottom:5px}.status strong{font-size:13px;color:#1d9a84}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(8,28,45,.04)}.company{padding:19px 22px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.company small{display:block;color:#8796a1;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}.company strong{font-size:17px;color:var(--text)}.company .meta{font-size:10px;color:#778793;text-align:right}.intro{padding:20px 22px;margin-bottom:20px}.intro h2{font-size:18px;margin:0 0 8px;color:#10263a}.intro p{font-size:11px;line-height:1.7;color:#5f707e;margin:0}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.legend div{border:1px solid #e3e9ed;border-radius:10px;padding:12px}.legend b{font-size:10px;color:var(--text)}.legend span{display:block;font-size:9px;color:#7a8994;line-height:1.5;margin-top:4px}.tablecard{padding:0;overflow:hidden}.table-wrap{overflow:auto}.matrix{width:100%;border-collapse:collapse;min-width:860px}.matrix th{background:#f7fafb;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#81909c;padding:15px 14px;border-bottom:1px solid var(--line)}.matrix td{padding:15px 14px;border-bottom:1px solid #edf1f3;vertical-align:middle}.matrix tr:last-child td{border-bottom:0}.pillar-name b{display:block;font-size:11px;color:var(--text)}.pillar-name span{display:block;font-size:9px;color:#8796a1;margin-top:4px}.maturity{font-weight:800;color:var(--blue);font-size:13px}.select{width:72px;border:1px solid #d7e0e5;border-radius:7px;padding:8px 7px;font:600 11px Montserrat;background:#fff;color:var(--text)}.score{font-weight:800;color:var(--blue);font-size:13px}.rank{display:inline-flex;min-width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:#edf4f7;color:#355263;font-weight:800;font-size:11px}.rank.top1{background:#d9f5f4;color:#0b7e87}.rank.top2{background:#eaf3f8;color:#255a78}.rank.top3{background:#f2f5f7;color:#64747f}.rank.top4{background:#f5f6f7;color:#7c8991}.reason{padding:22px;margin-top:20px}.reason h2{font-size:18px;margin:0 0 5px}.reason p{font-size:11px;color:#71808c;line-height:1.6;margin:0 0 16px}.reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reason-card{border:1px solid #e3e9ed;border-radius:10px;padding:14px}.reason-card label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#8b9aa4;font-weight:800;margin-bottom:6px}.reason-card p{margin:0;font-size:10px;color:#405361;line-height:1.6}.final{margin-top:20px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px}.final h2{font-size:18px;margin:0 0 6px;color:#10263a}.final p{font-size:11px;color:#71808c;line-height:1.6;margin:0 0 15px}.order{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.order-card{border:1px solid #e3e9ed;border-radius:10px;padding:15px}.order-card .n{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#8b9aa4;font-weight:800}.order-card b{display:block;font-size:11px;color:var(--text);margin-top:7px}.order-card span{display:block;font-size:10px;color:#7b8a96;margin-top:4px}.actions{margin-top:20px;padding:20px;background:var(--navy);color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}.actions h3{margin:0 0 5px;font-size:15px}.actions p{margin:0;color:#b8c8d4;font-size:10px;line-height:1.6}.buttons{display:flex;gap:9px;flex-wrap:wrap}.button{border:0;background:var(--cyan);color:#062033;padding:12px 18px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}.button.secondary{background:#fff;color:#153149}.button:disabled{opacity:.55;cursor:wait}.loading,.empty{padding:45px;text-align:center;color:#71808c;font-size:12px}.error{color:#b94a43}.saved{font-size:10px;color:#75c9b4;margin-top:8px;min-height:15px}
@media(max-width:900px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:28px 20px}.top{flex-direction:column}.status{text-align:left;width:100%}.company{display:block}.company .meta{text-align:left;margin-top:8px}.legend,.reason-grid,.order{grid-template-columns:1fr}.matrix{min-width:760px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo"><img src="../diagnostico/logo-monitore-branca.png" alt="Monitore Negócios Empresariais"><div class="sub">Gestão Empresarial</div></div><nav class="nav"><a href="../">Visão geral</a><a href="../diagnostico/">Diagnóstico</a><a href="../mapa-gestao/">Mapa de Gestão</a><a class="active" href="#">Matriz de Prioridades</a><a href="../plano/">Plano de Ação</a><a href="../indicadores/">Indicadores</a><a href="../ferramentas/">Ferramentas</a><a href="../rotina/">Rotina de Gestão</a><a href="../relatorio/">Relatório Final</a></nav></aside>
<main class="main"><div class="container" id="app"><div class="loading">Carregando a Matriz de Prioridades...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://reunexorxwbiirkypveu.supabase.co";
const SUPABASE_KEY="sb_publishable_1ucXcwRs0PsvEFWkLRsE1g_oIkKXlmg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defs=[
 {key:"gestao",name:"Gestão",desc:"Direcionamento, organização, liderança e tomada de decisão.",num:"01"},
 {key:"excelencia_operacional",name:"Excelência Operacional",desc:"Processos, padronização, eficiência e melhoria contínua.",num:"02"},
 {key:"inteligencia_negocios",name:"Inteligência de Negócios",desc:"Indicadores, informações, custos, resultados e decisões orientadas por dados.",num:"03"},
 {key:"desenvolvimento_pessoas",name:"Desenvolvimento de Pessoas",desc:"Clareza de papéis, liderança, feedback, capacitação e desenvolvimento.",num:"04"}
];
let token="",diagnostico=null,avaliacoes={},prioridades=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function score(a){return Number(a.impacto||0)*Number(a.urgencia||0)*(6-Number(a.esforco||0));}
function suggestedOrder(){return defs.map(d=>({key:d.key,score:score(avaliacoes[d.key]||{})})).sort((a,b)=>b.score-a.score).map((x,i)=>({key:x.key,ordem:i+1,score:x.score}));}
function options(){return [1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join("");}
function label(type,n){const maps={impacto:{1:"Muito baixo",2:"Baixo",3:"Moderado",4:"Alto",5:"Muito alto"},urgencia:{1:"Pode aguardar",2:"Baixa",3:"Moderada",4:"Alta",5:"Imediata"},esforco:{1:"Muito baixo",2:"Baixo",3:"Moderado",4:"Alto",5:"Muito alto"}};return maps[type][n]||"";}
function render(){
 const arr=suggestedOrder(); const byKey=Object.fromEntries(arr.map(x=>[x.key,x]));
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="eyebrow">Sprint de Gestão · Etapa 03</div><h1>Matriz de Prioridades</h1><div class="subtitle">Agora vamos transformar o diagnóstico em decisão. Avalie o impacto, a urgência e o esforço de cada pilar. A matriz calculará uma ordem sugerida de prioridade para orientar o Plano de Ação.</div></div><div class="status"><span>Status</span><strong id="saveStatus">Em definição</strong></div></div>
 <div class="card company"><div><small>Empresa avaliada</small><strong>${esc(diagnostico.empresa)}</strong></div><div class="meta">${esc(diagnostico.responsavel)}<br>${esc(diagnostico.segmento)} · ${esc(diagnostico.colaboradores)}</div></div>
 <section class="card intro"><h2>Como definir a prioridade?</h2><p>Não basta olhar apenas para a menor maturidade. Um tema pode ter maturidade baixa, mas outro pode gerar impacto maior ou exigir tratamento imediato. Por isso, a matriz combina três critérios para apoiar uma decisão mais consciente.</p><div class="legend"><div><b>Impacto</b><span>Quanto a melhoria deste pilar pode influenciar os resultados da empresa?</span></div><div><b>Urgência</b><span>Quanto este pilar precisa ser tratado agora?</span></div><div><b>Esforço</b><span>Quanto esforço será necessário para promover a melhoria?</span></div></div></section>
 <section class="card tablecard"><div class="table-wrap"><table class="matrix"><thead><tr><th>Pilar</th><th>Maturidade</th><th>Impacto</th><th>Urgência</th><th>Esforço</th><th>Índice</th><th>Ordem sugerida</th></tr></thead><tbody>${defs.map(d=>{const m=Number(diagnostico.pontuacoes?.[d.key]?.maturidade||0);const a=avaliacoes[d.key]||{impacto:3,urgencia:3,esforco:3};const o=byKey[d.key]?.ordem||"-";return `<tr><td class="pillar-name"><b>${d.num}. ${d.name}</b><span>${d.desc}</span></td><td class="maturity">${m.toFixed(1)}/5</td><td><select class="select eval" data-key="${d.key}" data-type="impacto">${options()}</select></td><td><select class="select eval" data-key="${d.key}" data-type="urgencia">${options()}</select></td><td><select class="select eval" data-key="${d.key}" data-type="esforco">${options()}</select></td><td class="score" id="score-${d.key}">${score(a)}</td><td><span class="rank top${o}">${o}</span></td></tr>`}).join("")}</tbody></table></div></section>
 <section class="card reason"><h2>Contexto da decisão</h2><p>Use também as respostas abertas do diagnóstico para validar se a ordem calculada faz sentido para a realidade da empresa.</p><div class="reason-grid"><div class="reason-card"><label>Maior desafio informado</label><p>${esc(diagnostico.visao_prioridades?.maior_desafio||"Não informado")}</p></div><div class="reason-card"><label>Problema a resolver em 30 dias</label><p>${esc(diagnostico.visao_prioridades?.problema_30_dias||"Não informado")}</p></div></div></section>
 <section class="final"><h2>Prioridade definida</h2><p>A ordem abaixo é calculada automaticamente a partir das avaliações. Ela será utilizada como referência para construir o Plano de Ação.</p><div class="order" id="order">${arr.map(x=>{const d=defs.find(y=>y.key===x.key);return `<div class="order-card"><div class="n">Prioridade ${x.ordem}</div><b>${d.name}</b><span>Índice ${x.score}</span></div>`}).join("")}</div><div class="saved" id="savedMsg"></div></section>
 <section class="actions"><div><h3>Próxima etapa: Plano de Ação</h3><p>Salve a matriz para registrar a decisão. Depois, avançaremos para a construção das ações prioritárias.</p></div><div class="buttons"><a class="button secondary" href="../mapa-gestao/?token=${encodeURIComponent(token)}">Voltar ao Mapa</a><button class="button" id="saveBtn">Salvar Matriz</button><a class="button" id="nextBtn" href="../plano/?token=${encodeURIComponent(token)}" style="display:none">Ir para Plano de Ação →</a></div></section>`;
 document.querySelectorAll(".eval").forEach(el=>{el.value=String(avaliacoes[el.dataset.key]?.[el.dataset.type]||3);el.addEventListener("change",()=>{avaliacoes[el.dataset.key]=avaliacoes[el.dataset.key]||{};avaliacoes[el.dataset.key][el.dataset.type]=Number(el.value);refresh();});});
 document.getElementById("saveBtn").addEventListener("click",save);
}
function refresh(){const arr=suggestedOrder();const by=Object.fromEntries(arr.map(x=>[x.key,x]));defs.forEach(d=>{document.getElementById("score-"+d.key).textContent=score(avaliacoes[d.key]||{});});document.querySelectorAll(".rank").forEach((el,i)=>{});defs.forEach(d=>{const r=document.querySelector(`.eval[data-key="${d.key}"]`);const row=r.closest("tr");const rank=row.querySelector(".rank");const o=by[d.key].ordem;rank.textContent=o;rank.className="rank top"+o;});document.getElementById("order").innerHTML=arr.map(x=>{const d=defs.find(y=>y.key===x.key);return `<div class="order-card"><div class="n">Prioridade ${x.ordem}</div><b>${d.name}</b><span>Índice ${x.score}</span></div>`}).join("");document.getElementById("saveStatus").textContent="Em definição";}
async function save(){const btn=document.getElementById("saveBtn");btn.disabled=true;document.getElementById("saveStatus").textContent="Salvando...";const arr=suggestedOrder();const aval=defs.map(d=>({pilar:d.key,impacto:Number(avaliacoes[d.key]?.impacto||3),urgencia:Number(avaliacoes[d.key]?.urgencia||3),esforco:Number(avaliacoes[d.key]?.esforco||3),indice:score(avaliacoes[d.key]||{})}));const pr=arr.map(x=>({pilar:x.key,ordem:x.ordem,indice:x.score}));const{error}=await sb.rpc("save_sprint_matriz",{p_access_token:token,p_avaliacoes:aval,p_prioridades:pr});if(error){console.error(error);document.getElementById("saveStatus").textContent="Erro ao salvar";document.getElementById("savedMsg").textContent="Não foi possível salvar a matriz. Verifique se o SQL da etapa 03 foi executado no Supabase.";btn.disabled=false;return;}document.getElementById("saveStatus").textContent="Matriz salva";document.getElementById("savedMsg").textContent="Matriz salva com sucesso. A próxima etapa poderá usar estas prioridades.";btn.textContent="Matriz Salva ✓";const next=document.getElementById("nextBtn");if(next)next.style.display="inline-block";}
async function load(){const params=new URLSearchParams(window.location.search);const fromUrl=params.get("token");if(fromUrl){localStorage.setItem("sprint_diagnostico_token",fromUrl);}token=fromUrl||localStorage.getItem("sprint_diagnostico_token");if(!token){document.getElementById("app").innerHTML='<div class="card empty">Diagnóstico ainda não localizado.<br><br>Conclua o diagnóstico primeiro.</div>';return;}const{data,error}=await sb.rpc("get_sprint_diagnostico",{p_access_token:token});if(error||!data?.length){document.getElementById("app").innerHTML='<div class="card empty error">Não foi possível carregar o diagnóstico para esta Matriz de Prioridades.</div>';return;}diagnostico=data[0];const saved=await sb.rpc("get_sprint_matriz",{p_access_token:token});if(!saved.error&&saved.data?.length){try{const av=saved.data[0].avaliacoes||[];av.forEach(x=>avaliacoes[x.pilar]=x);}catch(e){console.warn(e);}}render();}load();
</script></body></html>
