<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matriz de Prioridades | Sprint Monitore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--navy:#071b2c;--blue:#174b98;--cyan:#31c1ce;--text:#183247;--muted:#6d7d89;--line:#e2e9ee;--bg:#f5f8fa}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--text)}
.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--navy);color:#fff;padding:28px 20px;overflow:auto}
.logo{padding:2px 4px 28px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo img{display:block;width:178px;max-width:100%;height:auto}
.sub{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#aebdca;margin-top:8px}
.nav{margin-top:28px}.nav a{display:block;padding:12px 13px;margin-bottom:7px;border-radius:9px;color:#b8c7d3;text-decoration:none;font-size:12px;font-weight:600}
.nav a:hover,.nav a.active{background:#10324a;color:#fff}.nav a.active{border-left:3px solid var(--cyan);padding-left:10px}
.main{margin-left:250px;min-height:100vh;padding:38px 46px 60px}.container{max-width:1120px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#31aeba;text-transform:uppercase;margin-bottom:10px}
h1{font-size:30px;line-height:1.2;margin:0 0 9px;color:#10263a}
.subtitle{font-size:13px;line-height:1.8;color:#667786;max-width:780px}
.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;text-align:right}
.status span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#80909d;margin-bottom:5px}.status strong{font-size:13px;color:#1d9a84}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(8,28,45,.04)}
.company{padding:19px 22px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}
.company small{display:block;color:#8796a1;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.company strong{font-size:17px;color:var(--text)}.company .meta{font-size:10px;color:#778793;text-align:right;line-height:1.7}
.intro{padding:22px;margin-bottom:20px}.intro h2,.section-title{font-size:19px;margin:0 0 8px;color:#10263a}
.intro p,.section-copy{font-size:12px;line-height:1.8;color:#5f707e;margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}
.step{border:1px solid var(--line);border-radius:10px;padding:14px}.step b{font-size:12px;display:block;margin-bottom:5px}.step span{font-size:11px;line-height:1.65;color:#71808c;display:block}
.problem-list{display:grid;gap:14px;margin-top:18px}
.problem-card{border:1px solid var(--line);border-radius:12px;padding:18px}
.problem-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:13px}
.problem-head h3{font-size:14px;margin:0 0 5px}.problem-head p{font-size:11px;color:#71808c;margin:0;line-height:1.6}
.maturity{font-size:12px;font-weight:800;color:var(--blue);white-space:nowrap;background:#f0f5fb;border-radius:8px;padding:8px 10px}
.field-label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}
textarea,input,select{font:12px Montserrat,Arial,sans-serif;color:var(--text);width:100%;border:1px solid #d7e0e5;border-radius:8px;padding:11px;background:#fff}
textarea{resize:vertical;min-height:68px;line-height:1.6}
.criteria{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.criterion{border:1px solid #e7edf0;border-radius:9px;padding:12px}
.criterion label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}
.criterion p{font-size:10px;line-height:1.6;color:#71808c;margin:0 0 9px;min-height:32px}
.criterion select{padding:9px;font-weight:700}
.scoreline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:#687986}
.scoreline strong{font-size:13px;color:var(--blue)}
.context{padding:22px;margin-top:20px}.context h2{font-size:18px;margin:0 0 7px}
.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}
.context-item{border:1px solid var(--line);border-radius:10px;padding:14px}
.context-item label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#81909c;font-weight:800;margin-bottom:7px}
.context-item p{font-size:12px;line-height:1.7;margin:0;color:#405361}
.final{margin-top:20px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px}
.final h2{font-size:18px;margin:0 0 7px;color:#10263a}.final>p{font-size:11px;color:#71808c;line-height:1.7;margin:0 0 15px}
.order{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.order-card{border:1px solid var(--line);border-radius:10px;padding:15px;min-width:0}
.order-card .n{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#8b9aa4;font-weight:800}
.order-card b{display:block;font-size:11px;color:var(--text);margin-top:7px;overflow-wrap:anywhere}
.order-card span{display:block;font-size:10px;color:#7b8a96;margin-top:5px;line-height:1.6}
.actions{margin-top:20px;padding:22px;background:var(--navy);color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.actions h3{margin:0 0 6px;font-size:15px}.actions p{margin:0;color:#b8c8d4;font-size:11px;line-height:1.7}
.buttons{display:flex;gap:9px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--cyan);color:#062033;padding:12px 17px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}
.button.secondary{background:#fff;color:#153149}.button:disabled{opacity:.55;cursor:wait}
.loading,.empty{padding:45px;text-align:center;color:#71808c;font-size:12px}.error{color:#b94a43}.saved{font-size:11px;color:#16836f;margin-top:10px;min-height:16px}
.note{font-size:10px;color:#71808c;line-height:1.7;margin-top:12px}
@media(max-width:1000px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:28px 18px 45px}.top{flex-direction:column}.status{text-align:left;width:100%}.steps,.criteria,.order,.context-grid{grid-template-columns:1fr}.company{display:block}.company .meta{text-align:left;margin-top:8px}.actions{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><img src="../diagnostico/logo-monitore-branca.png" alt="Monitore Negócios Empresariais"><div class="sub">Gestão Empresarial</div></div>
  <nav class="nav">
    <a href="../">Visão geral</a><a href="../diagnostico/">Diagnóstico</a><a href="../mapa-gestao/">Mapa de Gestão</a><a class="active" href="#">Matriz de Prioridades</a><a href="../plano/">Plano de Ação</a><a href="../indicadores/">Indicadores</a><a href="../ferramentas/">Ferramentas</a><a href="../rotina/">Rotina de Gestão</a><a href="../relatorio/">Relatório Final</a>
  </nav>
</aside>
<main class="main"><div class="container" id="app"><div class="loading">Carregando a Matriz de Prioridades...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://reunexorxwbiirkypveu.supabase.co";
const SUPABASE_KEY="sb_publishable_1ucXcwRs0PsvEFWkLRsE1g_oIkKXlmg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defs=[
 {key:"gestao",name:"Gestão",desc:"Direcionamento, organização, liderança e tomada de decisão.",num:"01",question:"Que problema ou melhoria de gestão merece atenção nesta área?"},
 {key:"excelencia_operacional",name:"Excelência Operacional",desc:"Processos, padronização, eficiência e melhoria contínua.",num:"02",question:"Que problema de processo, qualidade, eficiência ou desperdício precisa ser tratado?"},
 {key:"inteligencia_negocios",name:"Inteligência de Negócios",desc:"Indicadores, informações, custos, resultados e decisões orientadas por dados.",num:"03",question:"Que informação, indicador ou resultado financeiro precisa ser melhor compreendido ou melhorado?"},
 {key:"desenvolvimento_pessoas",name:"Desenvolvimento de Pessoas",desc:"Clareza de papéis, liderança, feedback, capacitação e desenvolvimento.",num:"04",question:"Que desafio envolvendo liderança, equipe ou competências precisa ser tratado?"}
];
let token="",diagnostico=null,avaliacoes={},prioridades=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function score(a){return Number(a.impacto||0)*Number(a.urgencia||0)*(6-Number(a.esforco||0));}
function suggestedOrder(){return defs.map(d=>({key:d.key,score:score(avaliacoes[d.key]||{})})).sort((a,b)=>b.score-a.score||defs.findIndex(d=>d.key===a.key)-defs.findIndex(d=>d.key===b.key)).map((x,i)=>({key:x.key,ordem:i+1,score:x.score}));}
function options(type,selected){const words={impacto:{1:"1 — Muito baixo",2:"2 — Baixo",3:"3 — Moderado",4:"4 — Alto",5:"5 — Muito alto"},urgencia:{1:"1 — Pode aguardar",2:"2 — Baixa",3:"3 — Moderada",4:"4 — Alta",5:"5 — Imediata"},esforco:{1:"1 — Muito baixo",2:"2 — Baixo",3:"3 — Moderado",4:"4 — Alto",5:"5 — Muito alto"}};return [1,2,3,4,5].map(n=>`<option value="${n}" ${Number(selected||3)===n?"selected":""}>${words[type][n]}</option>`).join("");}
function render(){
 const arr=suggestedOrder();const maturity=d=>Number(diagnostico.pontuacoes?.[d.key]?.maturidade||0);
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="eyebrow">Sprint de Gestão · Etapa 03</div><h1>Matriz de Prioridades</h1><div class="subtitle">Agora vamos decidir o que merece atenção primeiro. O diagnóstico mostrou como sua empresa está hoje; o Mapa de Gestão destacou as áreas de atenção. Nesta etapa, você vai descrever o principal problema ou oportunidade em cada área e avaliar por onde faz mais sentido começar.</div></div><div class="status"><span>Status</span><strong id="saveStatus">Em definição</strong></div></div>
 <div class="card company"><div><small>Empresa avaliada</small><strong>${esc(diagnostico.empresa)}</strong></div><div class="meta">${esc(diagnostico.responsavel)}<br>${esc(diagnostico.segmento)} · ${esc(diagnostico.colaboradores)}</div></div>
 <section class="card intro"><h2>Como preencher esta matriz?</h2><p>Para cada área, escreva com suas palavras o que mais precisa melhorar. Use o desafio informado no diagnóstico como referência. Depois, avalie o impacto, a urgência e o esforço. Não existe resposta perfeita: o objetivo é tornar sua decisão mais consciente, não deixar que uma fórmula decida pela empresa.</p>
 <div class="steps"><div class="step"><b>1. Descreva o problema</b><span>Registre um problema concreto ou uma oportunidade de melhoria naquela área. Se não identificar um ponto específico, escreva “preciso avaliar melhor”.</span></div><div class="step"><b>2. Avalie os critérios</b><span>Use notas de 1 a 5. Impacto e urgência maiores aumentam a prioridade; esforço maior reduz a pontuação sugerida.</span></div><div class="step"><b>3. Valide a ordem</b><span>Leia a ordem calculada e confirme se ela faz sentido para a realidade da empresa antes de salvar.</span></div></div></section>
 <section class="problem-list">${defs.map(d=>{const a=avaliacoes[d.key]||{};return `<article class="card problem-card" data-pillar="${d.key}">
  <div class="problem-head"><div><h3>${d.num}. ${d.name}</h3><p>${d.desc}</p></div><div class="maturity">Maturidade: ${maturity(d).toFixed(1)}/5</div></div>
  <label class="field-label" for="problem-${d.key}">${d.question}</label>
  <textarea id="problem-${d.key}" class="problem-input" data-key="${d.key}" placeholder="Descreva o que acontece hoje e o que precisa melhorar...">${esc(a.problema||"")}</textarea>
  <div class="criteria">
   <div class="criterion"><label for="impacto-${d.key}">Impacto</label><p>Se resolvermos isso, quanto pode melhorar os resultados da empresa?</p><select id="impacto-${d.key}" class="eval" data-key="${d.key}" data-type="impacto">${options("impacto",a.impacto)}</select></div>
   <div class="criterion"><label for="urgencia-${d.key}">Urgência</label><p>Quanto precisamos agir logo para evitar prejuízos ou aproveitar uma oportunidade?</p><select id="urgencia-${d.key}" class="eval" data-key="${d.key}" data-type="urgencia">${options("urgencia",a.urgencia)}</select></div>
   <div class="criterion"><label for="esforco-${d.key}">Esforço</label><p>Quanto tempo, dinheiro e envolvimento da equipe serão necessários? Nota alta significa mais esforço.</p><select id="esforco-${d.key}" class="eval" data-key="${d.key}" data-type="esforco">${options("esforco",a.esforco)}</select></div>
  </div><div class="scoreline"><span>Pontuação sugerida (apoio à decisão)</span><strong id="score-${d.key}">${score(a)}</strong></div>
 </article>`}).join("")}</section>
 <section class="card context"><h2>O que você informou no diagnóstico</h2><p class="section-copy">Use essas respostas para verificar se as prioridades fazem sentido. Elas não são substituídas pelas notas desta matriz.</p><div class="context-grid"><div class="context-item"><label>Maior desafio informado</label><p>${esc(diagnostico.visao_prioridades?.maior_desafio||"Não informado")}</p></div><div class="context-item"><label>Problema que deseja resolver em 30 dias</label><p>${esc(diagnostico.visao_prioridades?.problema_30_dias||"Não informado")}</p></div></div></section>
 <section class="final"><h2>Ordem sugerida de prioridade</h2><p>Esta ordem é calculada a partir das suas notas. Ela é uma referência, não uma decisão automática. Se a ordem não refletir a realidade da empresa, revise as avaliações antes de salvar.</p><div class="order" id="order">${arr.map(x=>{const d=defs.find(y=>y.key===x.key);const a=avaliacoes[x.key]||{};return `<div class="order-card"><div class="n">Prioridade ${x.ordem}</div><b>${d.name}</b><span>${esc(a.problema||"Problema ainda não descrito")}</span><span>Pontuação: ${x.score}</span></div>`}).join("")}</div><div class="note">A pontuação serve para comparar as avaliações feitas nesta etapa. Ela não representa percentual, maturidade ou garantia de resultado.</div><div class="saved" id="savedMsg"></div></section>
 <section class="actions"><div><h3>Próxima etapa: Plano de Ação</h3><p>Ao salvar, você registra as avaliações e a ordem sugerida para usá-las como referência na construção do Plano de Ação.</p></div><div class="buttons"><a class="button secondary" href="../mapa-gestao/?token=${encodeURIComponent(token)}">Voltar ao Mapa</a><button class="button" id="saveBtn">Salvar Matriz</button><a class="button" id="nextBtn" href="../plano/?token=${encodeURIComponent(token)}" style="display:none">Ir para Plano de Ação →</a></div></section>`;
 document.querySelectorAll(".eval").forEach(el=>el.addEventListener("change",()=>{const key=el.dataset.key;avaliacoes[key]=avaliacoes[key]||{};avaliacoes[key][el.dataset.type]=Number(el.value);refresh();}));
 document.querySelectorAll(".problem-input").forEach(el=>el.addEventListener("input",()=>{const key=el.dataset.key;avaliacoes[key]=avaliacoes[key]||{};avaliacoes[key].problema=el.value;refreshOrderOnly();}));
 document.getElementById("saveBtn").addEventListener("click",save);
}
function refreshOrderOnly(){const arr=suggestedOrder();document.getElementById("order").innerHTML=arr.map(x=>{const d=defs.find(y=>y.key===x.key);const a=avaliacoes[x.key]||{};return `<div class="order-card"><div class="n">Prioridade ${x.ordem}</div><b>${d.name}</b><span>${esc(a.problema||"Problema ainda não descrito")}</span><span>Pontuação: ${x.score}</span></div>`}).join("");}
function refresh(){defs.forEach(d=>{document.getElementById("score-"+d.key).textContent=score(avaliacoes[d.key]||{});});refreshOrderOnly();document.getElementById("saveStatus").textContent="Em definição";document.getElementById("savedMsg").textContent="";}
async function save(){
 const btn=document.getElementById("saveBtn");btn.disabled=true;document.getElementById("saveStatus").textContent="Salvando...";
 const missing=defs.filter(d=>![1,2,3,4,5].includes(Number(avaliacoes[d.key]?.impacto))||![1,2,3,4,5].includes(Number(avaliacoes[d.key]?.urgencia))||![1,2,3,4,5].includes(Number(avaliacoes[d.key]?.esforco)));
 if(missing.length){document.getElementById("saveStatus").textContent="Avaliação incompleta";document.getElementById("savedMsg").textContent="Confira impacto, urgência e esforço nas quatro áreas antes de salvar.";btn.disabled=false;return;}
 const arr=suggestedOrder();
 const aval=defs.map(d=>({pilar:d.key,problema:String(avaliacoes[d.key]?.problema||"").trim(),impacto:Number(avaliacoes[d.key].impacto),urgencia:Number(avaliacoes[d.key].urgencia),esforco:Number(avaliacoes[d.key].esforco),indice:score(avaliacoes[d.key])}));
 const pr=arr.map(x=>({pilar:x.key,ordem:x.ordem,indice:x.score,problema:String(avaliacoes[x.key]?.problema||"").trim()}));
 const{error}=await sb.rpc("save_sprint_matriz",{p_access_token:token,p_avaliacoes:aval,p_prioridades:pr});
 if(error){console.error(error);document.getElementById("saveStatus").textContent="Erro ao salvar";document.getElementById("savedMsg").textContent="Não foi possível salvar a matriz. Verifique a conexão e se o SQL existente da etapa 03 foi executado no Supabase.";btn.disabled=false;return;}
 document.getElementById("saveStatus").textContent="Matriz salva";document.getElementById("savedMsg").textContent="Matriz salva com sucesso. Você já pode avançar para o Plano de Ação.";btn.textContent="Matriz Salva ✓";document.getElementById("nextBtn").style.display="inline-flex";btn.disabled=false;
}
async function load(){
 try{
  const params=new URLSearchParams(window.location.search);const fromUrl=params.get("token");if(fromUrl)localStorage.setItem("sprint_diagnostico_token",fromUrl);
  token=fromUrl||localStorage.getItem("sprint_diagnostico_token");
  if(!token){document.getElementById("app").innerHTML='<div class="card empty">Diagnóstico ainda não localizado.<br><br>Conclua o diagnóstico primeiro.</div>';return;}
  const{data,error}=await sb.rpc("get_sprint_diagnostico",{p_access_token:token});
  if(error||!data?.length){console.error(error);document.getElementById("app").innerHTML='<div class="card empty error">Não foi possível carregar o diagnóstico para esta Matriz de Prioridades. Volte ao Mapa de Gestão e tente novamente.</div>';return;}
  diagnostico=data[0];
  const saved=await sb.rpc("get_sprint_matriz",{p_access_token:token});
  if(!saved.error&&saved.data?.length){const av=saved.data[0].avaliacoes||[];av.forEach(x=>{avaliacoes[x.pilar]={...x};});}
  defs.forEach(d=>{avaliacoes[d.key]=avaliacoes[d.key]||{impacto:3,urgencia:3,esforco:3,problema:""};});
  render();
 }catch(e){console.error(e);document.getElementById("app").innerHTML='<div class="card empty error">Ocorreu um erro ao carregar a matriz. Atualize a página e tente novamente.</div>';}
}
load();
</script>
</body>
</html>
