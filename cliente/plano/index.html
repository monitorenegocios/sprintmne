<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plano de Ação | Sprint Monitore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f5f8fa;color:#172536}:root{--navy:#071b2c;--blue:#174b98;--cyan:#31c1ce;--text:#183247;--line:#e2e9ee}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--navy);color:#fff;padding:28px 20px}.logo{padding:2px 4px 28px;border-bottom:1px solid rgba(255,255,255,.12)}.logo img{display:block;width:178px;max-width:100%;height:auto}.sub{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#aebdca;margin-top:8px}.nav{margin-top:28px}.nav a{display:block;padding:12px 13px;margin-bottom:7px;border-radius:9px;color:#b8c7d3;text-decoration:none;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#10324a;color:#fff}.nav a.active{border-left:3px solid var(--cyan);padding-left:10px}.main{margin-left:250px;min-height:100vh;padding:38px 46px 60px}.container{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#31aeba;text-transform:uppercase;margin-bottom:10px}h1{font-size:30px;line-height:1.2;margin:0 0 9px;color:#10263a}.subtitle{font-size:13px;line-height:1.7;color:#667786;max-width:780px}.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;text-align:right}.status span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#80909d;margin-bottom:5px}.status strong{font-size:13px;color:#1d9a84}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(8,28,45,.04)}.company{padding:19px 22px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.company small{display:block;color:#8796a1;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}.company strong{font-size:17px;color:var(--text)}.company .meta{font-size:10px;color:#778793;text-align:right}.intro{padding:22px;margin-bottom:20px}.intro h2{font-size:18px;margin:0 0 9px;color:#10263a}.intro p{font-size:11px;line-height:1.75;color:#5f707e;margin:0}.notice{margin-top:15px;padding:13px 15px;border-left:3px solid var(--cyan);background:#f4fbfc;border-radius:8px;font-size:10px;line-height:1.65;color:#48606e}.action-card{padding:22px;margin-bottom:16px}.action-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.rank{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#d9f5f4;color:#0b7e87;font-weight:800;font-size:13px;margin-right:10px;vertical-align:middle}.action-title{font-size:17px;font-weight:800;color:var(--text)}.action-meta{font-size:10px;color:#73838f;margin-top:5px}.priority-score{font-size:10px;color:#80909d;text-align:right}.priority-score b{display:block;color:var(--blue);font-size:14px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#81919c;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e5;border-radius:8px;padding:11px 12px;font:500 11px Montserrat;background:#fff;color:var(--text);outline:none}.field textarea{min-height:76px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(49,193,206,.10)}.help{font-size:9px;color:#8a98a2;margin-top:5px;line-height:1.45}.summary{padding:22px;margin-top:20px}.summary h2{font-size:18px;margin:0 0 8px}.summary p{font-size:11px;line-height:1.65;color:#6e7e89;margin:0 0 15px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary-item{border:1px solid #e3e9ed;border-radius:9px;padding:12px}.summary-item small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:1px;color:#8b9aa4;font-weight:800}.summary-item b{display:block;font-size:11px;color:var(--text);margin-top:6px}.actions{margin-top:20px;padding:20px;background:var(--navy);color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}.actions h3{margin:0 0 5px;font-size:15px}.actions p{margin:0;color:#b8c8d4;font-size:10px;line-height:1.6}.buttons{display:flex;gap:9px;flex-wrap:wrap}.button{border:0;background:var(--cyan);color:#062033;padding:12px 18px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}.button.secondary{background:#fff;color:#153149}.button:disabled{opacity:.55;cursor:wait}.saved{font-size:10px;color:#75c9b4;margin-top:8px;min-height:15px}.loading,.empty{padding:45px;text-align:center;color:#71808c;font-size:12px}.error{color:#b94a43}
@media(max-width:900px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:28px 20px}.top{flex-direction:column}.status{text-align:left;width:100%}.company{display:block}.company .meta{text-align:left;margin-top:8px}.grid,.summary-grid{grid-template-columns:1fr}.action-head{display:block}.priority-score{text-align:left;margin-top:10px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo"><img src="../diagnostico/logo-monitore-branca.png" alt="Monitore Negócios Empresariais"><div class="sub">Gestão Empresarial</div></div><nav class="nav"><a href="../">Visão geral</a><a href="../diagnostico/">Diagnóstico</a><a href="../mapa-gestao/">Mapa de Gestão</a><a href="../matriz/">Matriz de Prioridades</a><a class="active" href="#">Plano de Ação</a><a href="../indicadores/">Indicadores</a><a href="../ferramentas/">Ferramentas</a><a href="../rotina/">Rotina de Gestão</a><a href="../relatorio/">Relatório Final</a></nav></aside>
<main class="main"><div class="container" id="app"><div class="loading">Carregando o Plano de Ação...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://reunexorxwbiirkypveu.supabase.co";
const SUPABASE_KEY="sb_publishable_1ucXcwRs0PsvEFWkLRsE1g_oIkKXlmg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defs=[
 {key:"gestao",name:"Gestão",desc:"Direcionamento, organização, liderança e tomada de decisão."},
 {key:"excelencia_operacional",name:"Excelência Operacional",desc:"Processos, padronização, eficiência e melhoria contínua."},
 {key:"inteligencia_negocios",name:"Inteligência de Negócios",desc:"Indicadores, informações, custos, resultados e decisões orientadas por dados."},
 {key:"desenvolvimento_pessoas",name:"Desenvolvimento de Pessoas",desc:"Clareza de papéis, liderança, feedback, capacitação e desenvolvimento."}
];
let token="",diagnostico=null,prioridades=[],acoes=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function findPriority(key){return prioridades.find(x=>x.pilar===key)||{};}
function render(){
 const ordered=[...prioridades].sort((a,b)=>Number(a.ordem)-Number(b.ordem));
 const top=ordered.slice(0,4);
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="eyebrow">Sprint de Gestão · Etapa 04</div><h1>Plano de Ação</h1><div class="subtitle">Agora vamos transformar as prioridades definidas em ações concretas. O objetivo não é criar uma lista enorme de tarefas, mas definir o que precisa ser feito, por quem e até quando.</div></div><div class="status"><span>Status</span><strong id="saveStatus">Em construção</strong></div></div>
 <div class="card company"><div><small>Empresa avaliada</small><strong>${esc(diagnostico.empresa)}</strong></div><div class="meta">${esc(diagnostico.responsavel)}<br>${esc(diagnostico.segmento)} · ${esc(diagnostico.colaboradores)}</div></div>
 <section class="card intro"><h2>Como construir seu plano?</h2><p>Comece pela prioridade 1 e defina uma ação objetiva para produzir uma mudança concreta. Depois avance para as demais prioridades. Cada ação deve ter um responsável, um prazo e uma forma simples de verificar se foi realizada.</p><div class="notice"><strong>Regra prática:</strong> uma boa ação começa com um verbo claro: definir, organizar, padronizar, implantar, revisar, medir, treinar, reduzir, eliminar ou acompanhar.</div></section>
 ${top.map((p,i)=>{const d=defs.find(x=>x.key===p.pilar)||{name:p.pilar,desc:""};const old=acoes.find(x=>x.pilar===p.pilar)||{};return `<section class="card action-card"><div class="action-head"><div><span class="rank">${i+1}</span><span class="action-title">${esc(d.name)}</span><div class="action-meta">${esc(d.desc)}</div></div><div class="priority-score">Índice de prioridade<b>${esc(p.indice)}</b></div></div><div class="grid"><div class="field full"><label>Objetivo da melhoria</label><textarea data-pilar="${p.pilar}" data-field="objetivo" placeholder="Ex.: Organizar a rotina de gestão e definir claramente as prioridades da empresa.">${esc(old.objetivo)}</textarea><div class="help">O que precisa mudar ao final desta ação?</div></div><div class="field full"><label>Ação principal</label><textarea data-pilar="${p.pilar}" data-field="acao" placeholder="Descreva uma ação concreta que será executada.">${esc(old.acao)}</textarea><div class="help">Prefira uma ação específica e executável, evitando termos genéricos como “melhorar” ou “acompanhar”.</div></div><div class="field"><label>Responsável</label><input data-pilar="${p.pilar}" data-field="responsavel" value="${esc(old.responsavel)}" placeholder="Nome ou função"></div><div class="field"><label>Prazo</label><input type="date" data-pilar="${p.pilar}" data-field="prazo" value="${esc(old.prazo)}"></div><div class="field"><label>Indicador de acompanhamento</label><input data-pilar="${p.pilar}" data-field="indicador" value="${esc(old.indicador)}" placeholder="Ex.: % de processos padronizados"></div><div class="field"><label>Meta</label><input data-pilar="${p.pilar}" data-field="meta" value="${esc(old.meta)}" placeholder="Ex.: 100% até 30/11"></div><div class="field"><label>Status</label><select data-pilar="${p.pilar}" data-field="status"><option value="Não iniciado">Não iniciado</option><option value="Em andamento">Em andamento</option><option value="Concluído">Concluído</option><option value="Bloqueado">Bloqueado</option></select></div><div class="field"><label>Recursos / observações</label><input data-pilar="${p.pilar}" data-field="observacoes" value="${esc(old.observacoes)}" placeholder="Recursos, dependências ou observações"></div></div></section>`}).join("")}
 <section class="card summary"><h2>Visão do Plano</h2><p>Estas são as prioridades que orientarão a execução do Sprint. O detalhamento acima transforma cada prioridade em uma ação acompanhável.</p><div class="summary-grid">${top.map((p,i)=>{const d=defs.find(x=>x.key===p.pilar)||{};return `<div class="summary-item"><small>Prioridade ${i+1}</small><b>${esc(d.name)}</b></div>`}).join("")}</div><div class="saved" id="savedMsg"></div></section>
 <section class="actions"><div><h3>Próxima etapa: Indicadores</h3><p>Salve o plano. Depois vamos estruturar como acompanhar os resultados e medir a evolução.</p></div><div class="buttons"><a class="button secondary" href="../matriz/?token=${encodeURIComponent(token)}">Voltar à Matriz</a><button class="button" id="saveBtn">Salvar Plano de Ação</button></div></section>`;
 document.querySelectorAll("[data-field]").forEach(el=>{if(el.tagName==="SELECT")el.value=acoes.find(x=>x.pilar===el.dataset.pilar)?.status||"Não iniciado";el.addEventListener("input",capture);el.addEventListener("change",capture);});
 document.getElementById("saveBtn").addEventListener("click",save);
}
function capture(){const p=this.dataset.pilar;let a=acoes.find(x=>x.pilar===p);if(!a){a={pilar:p};acoes.push(a);}a[this.dataset.field]=this.value;}
async function save(){document.querySelectorAll("[data-field]").forEach(el=>{const p=el.dataset.pilar;let a=acoes.find(x=>x.pilar===p);if(!a){a={pilar:p};acoes.push(a);}a[el.dataset.field]=el.value;});const btn=document.getElementById("saveBtn");btn.disabled=true;document.getElementById("saveStatus").textContent="Salvando...";const {error}=await sb.rpc("save_sprint_plano",{p_access_token:token,p_acoes:acoes});if(error){console.error(error);document.getElementById("saveStatus").textContent="Erro ao salvar";document.getElementById("savedMsg").textContent="Não foi possível salvar o plano. Verifique se o SQL da Etapa 04 foi executado no Supabase.";btn.disabled=false;return;}document.getElementById("saveStatus").textContent="Plano salvo";document.getElementById("savedMsg").textContent="Plano de Ação salvo com sucesso.";btn.textContent="Plano Salvo ✓";}
async function load(){
 try{
  const params=new URLSearchParams(window.location.search);
  const fromUrl=params.get("token");
  if(fromUrl){localStorage.setItem("sprint_diagnostico_token",fromUrl);}
  token=fromUrl||localStorage.getItem("sprint_diagnostico_token");
  if(!token){document.getElementById("app").innerHTML='<div class="card empty">Diagnóstico ainda não localizado.<br><br>Conclua o diagnóstico primeiro.</div>';return;}
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tempo limite de conexão com o Supabase.")),15000));
  const d=await Promise.race([sb.rpc("get_sprint_diagnostico",{p_access_token:token}),timeout]);
  if(d.error||!d.data?.length){throw new Error(d.error?.message||"Diagnóstico não encontrado para este token.");}
  diagnostico=d.data[0];
  const m=await Promise.race([sb.rpc("get_sprint_matriz",{p_access_token:token}),timeout]);
  if(m.error||!m.data?.length){document.getElementById("app").innerHTML='<div class="card empty error">A Matriz de Prioridades ainda não foi salva. Volte à Matriz, conclua as avaliações e clique em “Salvar Matriz”.</div>';return;}
  prioridades=Array.isArray(m.data[0].prioridades)?m.data[0].prioridades:[];
  if(!prioridades.length){document.getElementById("app").innerHTML='<div class="card empty error">A Matriz foi encontrada, mas não contém prioridades salvas. Volte à Matriz e clique em “Salvar Matriz”.</div>';return;}
  const p=await Promise.race([sb.rpc("get_sprint_plano",{p_access_token:token}),timeout]);
  if(!p.error&&p.data?.length){acoes=Array.isArray(p.data[0].acoes)?p.data[0].acoes:[];}
  render();
 }catch(err){
  console.error("Erro ao carregar Plano de Ação:",err);
  document.getElementById("app").innerHTML='<div class="card empty error"><strong>Não foi possível carregar o Plano de Ação.</strong><br><br>'+esc(err.message||"Erro de conexão")+'<br><br>Atualize a página. Se o problema continuar, envie esta tela para a Monitore.</div>';
 }
}
load();
</script></body></html>
